        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }

components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: Better Auth session
      description: Verified account session presented through the Authorization bearer credential or Better Auth session cookie. Event and organization grants are resolved server-side; query strings never grant access.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: Eventloom scoped API key
      description: Organization-scoped API key for mounted public-v1 webhook administration.
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: Organization tenant selected by the route; it must match the authenticated membership or API key.
      schema: { type: string, minLength: 1, maxLength: 200, example: ai-engineer }
    PublicResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    PublicCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    PublicLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PublicSort:
      name: sort
      in: query
      required: false
      schema: { type: string }
    PublicEventsSort:
      name: sort
      in: query
      required: false
      schema: { type: string, enum: [id, name, updatedAt], default: id }
    PublicSpeakersSort:
      name: sort
      in: query
      required: false
      schema: { type: string, enum: [id, displayName, updatedAt], default: id }
    PublicAgendaSort:
      name: sort
      in: query
      required: false
      schema: { type: string, enum: [id, updatedAt], default: id }
    PublicSessionsSort:
      name: sort
      in: query
      required: false
      schema: { type: string, enum: [id, title, updatedAt], default: id }
    PublicDirection:
      name: direction
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: asc }
    PublicFilter:
      name: filter
      in: query
      required: false
      description: "JSON object filter, or dotted (filter.field) / bracketed (filter[field]) encoding. Only these resource-specific fields are documented and accepted: events (slug), speakers (eventId, displayName), agenda (revision), and sessions (eventId, status). Unsupported filter fields and unrelated query parameters are rejected."
      schema: { type: string }
    EventId:
      name: eventId
      in: path
      required: true
      description: Event selected inside the organization or account grant.
      schema: { type: string, minLength: 1, maxLength: 200 }
    EventSlug:
      name: eventSlug
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    RoomId:
      name: roomId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    TrackId:
      name: trackId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    WarningId:
      name: warningId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    EntityId:
      name: entityId
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    TemplateVersion:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TemplateVersionQuery:
      name: version
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    TemplatePurpose:
      name: purpose
      in: query
      required: false
      schema: { $ref: "#/components/schemas/CommunicationPurpose" }
    PreviewId:
      name: previewId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    SendId:
      name: sendId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    RecipientId:
      name: recipientId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    DefinitionIdQuery:
      name: definitionId
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    SuggestionRunId:
      name: runId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    SourceId:
      name: sourceId
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    CapabilityId:
      name: capabilityId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    CapabilityToken:
      name: token
      in: path
      required: true
      description: Opaque single-use bearer token bound to the transfer capability identifier.
      schema: { type: string, minLength: 32, maxLength: 512 }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for one intended mutation; a different body with the same key is rejected.
      schema: { type: string, minLength: 8, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Required header-only positive resource version from the latest ETag; a body expectedVersion value is not a substitute. Strong or weak quoted values are accepted.
      schema: { type: string, pattern: '^(W/)?"?[1-9][0-9]*"?$' }
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: UUID request trace echoed by the API.
      schema: { type: string, format: uuid }
    SessionQuery:
      name: query
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: object
        properties:
          status: { type: string }
          search: { type: string, maxLength: 200 }
          roomId: { type: string }
          trackId: { type: string }
          formatId: { type: string }
          levelId: { type: string }
          tagId: { type: string }
          speakerId: { type: string }
          sortBy: { type: string, enum: [title, status, durationMinutes, createdAt, updatedAt, roomId, trackId] }
          direction: { type: string, enum: [asc, desc] }
          limit: { type: integer, minimum: 1, maximum: 100 }
          offset: { type: integer, minimum: 0 }
          agendaEligible: { type: boolean }
        additionalProperties: false
    RemixSourceType:
      name: sourceType
      in: query
      required: true
      schema: { type: string, enum: [session, speaker] }
    RemixStatus:
