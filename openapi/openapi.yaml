openapi: 3.1.0
info:
  title: Eventloom API
  version: 1.0.0
  summary: Organization-scoped application operations, webhook administration, and published projections.
  description: |
    Direct clients use the operator's configured API origin. Browser traffic
    may use the deployed web app's same-origin `/api/*` proxy; it forwards to
    the API Worker and is not a separate API origin.

    The checked-in document intentionally combines a substantial set of internal application API paths
    (`/api/admin/...`, `/api/speaker/...`, and `/api/public/...`) with tenant-scoped public-v1
    webhook administration. It is not an exhaustive inventory of every mounted
    session-authenticated application route. Internal routes may require
    organizer or participant session authentication and are not public-v1 guarantees.

    Organizer routes are qualified by organizationId and eventId and require an authenticated
    organizer session. Participant routes require the authenticated account's event grant.
    Public-v1 webhook routes are API-key authenticated and tenant-bound by organizationId.
    Separate public embeds and feeds expose immutable published projections only; they never expose
    organizer drafts, private assets, recipient data, evaluation notes, advisory candidates, or
    internal storage coordinates.

    Generic public-v1 events, sessions, speakers, and agenda routes are intentionally not mounted.
    They require publication-safe field allowlists, bounded projection reads, and durable
    concurrency coordination before they can be advertised. Webhook POST/PATCH/PUT/DELETE routes do
    not require Idempotency-Key or If-Match. A request may not select a tenant or event outside the
    authenticated principal's grants.
  license:
    name: Elastic License 2.0
    identifier: Elastic-2.0
servers:
  - url: /
    description: API origin
tags:
  - name: System
  - name: Organizations
  - name: Events
  - name: Sessions
  - name: Agenda
  - name: Communications
  - name: Reports
  - name: Remix
  - name: Portal
  - name: Public
  - name: Webhooks
security: []
paths:
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check API liveness
      security: []
      responses:
        "200":
          description: API is configured and live.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503": { $ref: "#/components/responses/ConfigurationError" }
  /api/v1/openapi.json:
    get:
      tags: [System]
      operationId: getRuntimeOpenApi
      summary: Describe mounted runtime adapters
      description: Runtime discovery describes the mounted public-v1 webhook operations and omits withheld generic program-resource routes.
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 discovery document.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [openapi, info, paths]
                properties:
                  openapi: { type: string, const: 3.1.0 }
                  info: { type: object }
                  paths: { type: object }
                additionalProperties: true

